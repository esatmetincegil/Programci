"id":"14-1","q":"Telnet varsayılan portu kaçtır?","options":["21","22","23","80"],"a":2,"e":"Telnet 23."},{"id":"14-2","q":"HTTPS varsayılan portu kaçtır?","options":["80","110","443","3389"],"a":2,"e":"HTTPS 443."},{"id":"14-3","q":"DNS portu hangisidir?","options":["25","53","67","143"],"a":1,"e":"DNS 53."},{"id":"14-4","q":"Otomatik IP yapılandırması hangi hizmetle yapılır?","options":["DNS","ARP","DHCP","HTTP"],"a":2,"e":"DHCP."},{"id":"14-5","q":"IPv4 adresinden yerel MAC çözümlemesi hangisidir?","options":["ARP","SMTP","POP3","FTP"],"a":0,"e":"ARP."},{"id":"14-6","q":"Ping tipik olarak hangi protokolü kullanır?","options":["TCP","UDP","ICMP","FTP"],"a":2,"e":"ICMP Echo."},{"id":"14-7","q":"/24 IPv4 maskesi hangisidir?","options":["255.0.0.0","255.255.0.0","255.255.255.0","255.255.255.192"],"a":2,"e":"24 önek biti."},{"id":"14-8","q":"172.20.1.5 ne tür IP'dir?","options":["Genel","Özel","Loopback","Multicast"],"a":1,"e":"172.16/12 özel aralıktır."},{"id":"14-9","q":"HTTP/3 hangi teknolojiyi kullanır?","options":["TCP","QUIC/UDP","ICMP","SMTP"],"a":1,"e":"HTTP/3 QUIC üzerinden çalışır."}]},{"name":"Ofis Yazılımları","weight":5,"questions":[{"id":"15-0","q":"Excel'de mutlak başvuru hangisidir?","options":["A1","$A1","A$1","$A$1"],"a":3,"e":"Satır ve sütun sabit."},{"id":"15-1","q":"Excel'de sadece satırı sabit başvuru hangisidir?","options":["A1","$A1","A$1","$A$1"],"a":2,"e":"$ satır numarasından önce."},{"id":"15-2","q":"PowerPoint Shift+F5 ne yapar?","options":["Yeni slayt","Baştan sunum","Geçerli slayttan sunum","Kaydet"],"a":2,"e":"Geçerli slayt."},{"id":"15-3","q":"PowerPoint Ctrl+M ne yapar?","options":["Yeni slayt","Gösterim","Biçim kopyalama","Kapatma"],"a":0,"e":"Yeni slayt ekler."},{"id":"15-4","q":"Excel COUNT neyi sayar?","options":["Boşlar","Sayısal değerler","Metinler","Hatalar"],"a":1,"e":"COUNT sayısal değerler."},{"id":"15-5","q":"Excel COUNTA neyi sayar?","options":["Yalnız sayılar","Boş olmayanlar","Yalnız formüller","Yalnız tarihler"],"a":1," const KEY='programci_sinav_v1';let state={history:[],misses:[]};try{const v=JSON.parse(localStorage.getItem(KEY)||'{}');if(Array.isArray(v.history)&&Array.isArray(v.misses))state=v}catch(e){}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function h(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const date=()=>new Date().toLocaleDateString('sv-SE');
function hash(str){let k=2166136261;for(const c of str)k=Math.imul(k^c.charCodeAt(0),16777619);return k>>>0}
function shuffle(arr,seed){let a=arr.slice(),x=seed||1;for(let i=a.length-1;i>0;i--){x^=x<<13;x^=x>>>17;x^=x<<5;let j=(x>>>0)%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const lookup=Object.fromEntries(data.flatMap(t=>t.questions.map(q=>[q.id,{...q,topic:t.name}])));
let active=null,index=0,answers={},started=0;
function show(id){for(const x of ['home','exam','result'])document.getElementById(x).classList.toggle('hide',x!==id);window.scrollTo(0,0)}
function daily(){const d=date();return shuffle(data.flatMap((t,i)=>shuffle(t.questions,hash(d+'d'+i)).slice(0,t.weight+1).map(q=>({...q,topic:t.name}))),hash(d+'order')).slice(0,20)}
function full(){const d=date();return shuffle(data.flatMap((t,i)=>shuffle(t.questions,hash(d+'f'+i)).slice(0,t.weight).map(q=>({...q,topic:t.name}))),hash(d+'fullorder'))}
function focus(){let all=state.misses.map(x=>lookup[x]).filter(Boolean);let other=data.flatMap(t=>t.questions.map(q=>({...q,topic:t.name}))).filter(q=>!state.misses.includes(q.id));return shuffle([...all,...shuffle(other,hash(date()+'other'))],hash(date()+'focus')).slice(0,20)}
function home(){let hist=state.history.slice(-6).reverse();document.getElementById('home').innerHTML=`<div class="card"><h2>Bugün nasıl çalışacağız?</h2><p>70 soruluk tam deneme, 20 soruluk günlük karışık tekrar veya daha önce yanlış yaptığın sorular.</p><div class="grid"><button class="btn primary" onclick="start('daily')">⚡ Günlük 20 soru</button><button class="btn" onclick="start('full')">📝 Tam 70 soru</button><button class="btn" onclick="start('focus')">🎯 Yanlış tekrarları</button><button class="btn" onclick="historyView()">📊 Geçmiş sonuçlar</button></div><p class="sub">Her gün tarih bazlı farklı seçim; ${data.reduce((n,t)=>n+t.questions.length,0)} soruluk havuz sınırlıdır, bazı sorular tekrarlanabilir. İnternet üzerinden yeni soru çekilmez.</p></div><div class="card"><h2>Resmî soru dağılımı</h2>${data.map(t=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #31415b"><span class="small">${h(t.name)}</span><b>${t.weight}</b></div>`).join('')}</div><div class="card"><h2>Son sonuçlar</h2>${hist.length?hist.map(r=>`<p class="small">${h(r.day)} • ${h(r.mode)} • <b>${r.correct}/${r.total}</b></p>`).join(''):'<p>Henüz deneme çözmedin.</p>'}<button class="btn" onclick="exportBackup()">Yedek indir</button> <label class="btn file" for="upload">Yedek yükle</label><input style="display:none" type="file" id="upload" accept=".json" onchange="importBackup(event)"><p class="sub">Sonuçlar cihazın tarayıcı depolamasındadır. Yedek al; Safari verilerini silersen kayıtlar kaybolabilir.</p></div>`;show('home')}
function start(mode){active={mode,qs:mode==='full'?full():mode==='daily'?daily():focus()};index=0;answers={};started=Date.now();renderExam();show('exam')}
function choose(n){answers[index]=n;renderExam()}function step(n){index=Math.max(0,Math.min(active.qs.length-1,index+n));renderExam()}function jump(n){index=n;renderExam()}function clearChoice(){delete answers[index];renderExam()}
function renderExam(){const N=active.qs.length,q=active.qs[index];const done=Object.keys(answers).length;document.getElementById('exam').innerHTML=`<div class="card"><div class="sub">${active.mode==='full'?'Tam 70 soruluk deneme':active.mode==='daily'?'Günlük 20 soru':'Eksiklere dönüş'} · ${done}/${N} işaretli</div><progress value="${done}" max="${N}"></progress><div class="nav">${Array.from({length:Math.ceil(N/10)},(_,i)=>`<button class="btn ${Math.floor(index/10)===i?'active':''}" onclick="jump(${i*10})">${i+1}</button>`).join('')}</div><p class="sub">Soru ${index+1} / ${N} • ${h(q.topic)}</p><h2 class="question">${h(q.q)}</h2>${q.options.map((o,k)=>`<label class="choice"><input type="radio" name="answer" ${answers[index]===k?'checked':''} onchange="choose(${k})"><b>${'ABCD'[k]})</b> ${h(o)}</label>`).join('')}<div class="rows"><button class="btn" ${index===0?'disabled':''} onclick="step(-1)">← Önceki</button><button class="btn" ${index===N-1?'disabled':''} onclick="step(1)">Sonraki →</button></div><p><button class="btn" onclick="clearChoice()">İşareti kaldır</button> <button class="btn primary" onclick="confirmFinish()">Sınavı bitir</button></p><div class="nav">${active.qs.map((_,i)=>`<button class="btn ${answers[i]!==undefined?'active':''}" onclick="jump(${i})">${i+1}</button>`).join('')}</div></div>`}
function confirmFinish(){let blank=active.qs.length-Object.keys(answers).length;if(confirm(`Sınavı bitirmek istiyor musun? ${blank} boş soru var.`))finish()}
function finish(){let qs=active.qs,correct=qs.filter((q,i)=>q.a===answers[i]).length,wrong=qs.filter((q,i)=>answers[i]!==undefined&&q.a!==answers[i]).length;state.misses=[...new Set([...state.misses,...qs.filter((q,i)=>q.a!==answers[i]).map(q=>q.id)])];let rec={day:date(),time:new Date().toLocaleTimeString('tr-TR'),mode:active.mode,total:qs.length,correct,wrong,blank:qs.length-correct-wrong,topics:data.map(t=>({name:t.name,total:qs.filter(q=>q.topic===t.name).length,correct:qs.filter((q,i)=>q.topic===t.name&&q.a===answers[i]).length}))};state.history.push(rec);save();showResult(rec)}
function showResult(rec){let misses=active.qs.map((q,i)=>({...q,i})).filter(q=>answers[q.i]!==q.a);document.getElementById('result').innerHTML=`<div class="card"><h2>Deneme sonucun</h2><div class="grid"><div class="stat"><b>${rec.correct}</b>Doğru</div><div class="stat"><b>${rec.wrong}</b>Yanlış</div><div class="stat"><b>${rec.blank}</b>Boş</div><div class="stat"><b>${Math.round(rec.correct/rec.total*100)}%</b>Başarı</div></div><h2>Konu analizi</h2>${rec.topics.filter(t=>t.total).map(t=>`<div class="small" style="padding:7px 0">${h(t.name)} <b style="float:right">${t.correct}/${t.total}</b><div class="line"><div style="width:${t.correct/t.total*100}%"></div></div></div>`).join('')}</div><div class="card"><h2>Yanlış ve boş sorular</h2>${misses.length?misses.map(q=>`<div style="border-bottom:1px solid #34445e;padding:12px 0"><p class="sub">Soru ${q.i+1} • ${h(q.topic)}</p><p class="question">${h(q.q)}</p><p class="small">Senin cevabın: ${answers[q.i]===undefined?'Boş':('ABCD'[answers[q.i]]+' — '+h(q.options[answers[q.i]]))}</p><p class="small good">Doğru: ${'ABCD'[q.a]} — ${h(q.options[q.a])}</p><p class="small">${h(q.e)}</p></div>`).join(''):'<p>Bütün cevapların doğru!</p>'}</div><button class="btn primary" onclick="home()">Ana sayfaya dön</button>`;show('result')}
function historyView(){document.getElementById('result').innerHTML=`<div class="card"><h2>Geçmiş sonuçlar</h2>${state.history.slice().reverse().map(r=>`<p>${h(r.day)} ${h(r.time)} • ${h(r.mode)} • <b>${r.correct}/${r.total}</b> doğru; ${r.wrong} yanlış; ${r.blank} boş</p>`).join('')||'<p>Henüz kayıt yok.</p>'}</div><button class="btn" onclick="home()">Geri</button>`;show('result')}
function exportBackup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='programci-sinav-yedek.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function importBackup(e){let file=e.target.files[0];if(!file)return;file.text().then(txt=>{try{let obj=JSON.parse(txt);if(!Array.isArray(obj.history)||!Array.isArray(obj.misses))throw Error();if(confirm('Mevcut kayıtlar yedek ile değiştirilsin mi?')){state=obj;save();home()}}catch(err){alert('Geçersiz yedek dosyası')}})}
home();
</script></body></html>
